/* continuous loops while the wheel spins: wheel rumble + ball rolling on the track */
function spinStart(){
  if(!ac||ac.state!=='running'||spin)return;
  const t=T(),loop=()=>{const s=ac.createBufferSource();s.buffer=noiseBuf;s.loop=true;return s},N={};
  N.w=loop();const wf=ac.createBiquadFilter();wf.type='lowpass';wf.frequency.value=240;
  N.wg=ac.createGain();N.wg.gain.setValueAtTime(0,t);N.wg.gain.linearRampToValueAtTime(.1,t+.6);
  N.w.connect(wf);wf.connect(N.wg);N.wg.connect(master);
  N.h=ac.createOscillator();N.h.type='triangle';N.h.frequency.value=64;
  N.hg=ac.createGain();N.hg.gain.setValueAtTime(0,t);N.hg.gain.linearRampToValueAtTime(.03,t+.8);
  N.h.connect(N.hg);N.hg.connect(master);
  N.b=loop();N.bf=ac.createBiquadFilter();N.bf.type='bandpass';N.bf.frequency.value=1200;N.bf.Q.value=.8;
  const bt=ac.createGain();bt.gain.value=.55;
  N.lfo=ac.createOscillator();N.lfo.frequency.value=14;const lg=ac.createGain();lg.gain.value=.45;
  N.lfo.connect(lg);lg.connect(bt.gain);
  N.bg=ac.createGain();N.bg.gain.value=0;
  N.b.connect(N.bf);N.bf.connect(bt);bt.connect(N.bg);N.bg.connect(master);
  N.w.start(t,R(0,1.5));N.b.start(t,R(0,1.5));N.h.start(t);N.lfo.start(t);
  spin=N;
}
function spinRoll(p){
  if(!spin)return;
  const s=Math.pow(1-p,2),t=T(),lvl=(p<.72?.15:.09)*Math.sqrt(s);
  spin.bg.gain.setTargetAtTime(lvl,t,.06);
  spin.bf.frequency.setTargetAtTime(500+s*1500,t,.06);
  spin.lfo.frequency.setTargetAtTime(3+s*16,t,.06);
}
function spinStop(){
  if(!spin)return;
  const N=spin,t=T();spin=null;
  [N.wg,N.hg,N.bg].forEach(g=>g.gain.setTargetAtTime(0,t,.35));
  setTimeout(()=>{[N.w,N.h,N.b,N.lfo].forEach(n=>{try{n.stop()}catch(e){}})},2500);
}
