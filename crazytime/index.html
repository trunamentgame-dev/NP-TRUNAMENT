.arena-box{padding:52px 0 80px;background:radial-gradient(ellipse at 50% 40%,#7a1636 0%,#4a0d25 52%,#1f0511 100%)}
.arena-box::before{inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,226,122,.30) 0,rgba(255,200,90,.09) 36%,transparent 62%);-webkit-mask-image:none;mask-image:none;animation:none;z-index:1}
.room{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(circle at 30px 30px,rgba(245,158,11,.12) 2px,transparent 3px) 0 0/60px 60px,radial-gradient(circle at 0 0,rgba(245,158,11,.08) 2px,transparent 3px) 0 0/60px 60px,repeating-linear-gradient(90deg,transparent 0 118px,rgba(245,158,11,.14) 118px 120px)}
.room i{position:absolute;display:block}
.room .curt{top:0;bottom:0;width:13%;background:repeating-linear-gradient(90deg,#4a0818 0,#a3122f 7px,#4a0818 14px)}
.room .curt.l{left:0;-webkit-mask-image:linear-gradient(90deg,#000 70%,transparent);mask-image:linear-gradient(90deg,#000 70%,transparent)}
.room .curt.r{right:0;-webkit-mask-image:linear-gradient(270deg,#000 70%,transparent);mask-image:linear-gradient(270deg,#000 70%,transparent)}
.room .floor{left:0;right:0;bottom:0;height:58px;background:linear-gradient(180deg,rgba(0,0,0,.65),transparent 60%),repeating-conic-gradient(#4a0d3a 0 25%,#2c0824 0 50%) 0 0/30px 30px;border-top:5px solid;border-image:linear-gradient(90deg,#6b4408,#f59e0b,#6b4408) 1}
.room .cornice{left:0;right:0;top:0;height:22px;background:linear-gradient(180deg,#f59e0b,#8a5a0c 55%,#2a1404);box-shadow:0 6px 14px rgba(0,0,0,.6)}
.room .bulbs{left:0;right:0;top:26px;height:12px;background:radial-gradient(circle,#fff6c8 0 2px,rgba(255,210,100,.55) 3px,transparent 6px) 0 0/30px 12px repeat-x}
.stage::before{box-shadow:0 0 0 2px #5a3a05,inset 0 0 22px rgba(0,0,0,.85),0 16px 26px rgba(0,0,0,.7)}
.result-badge{bottom:10px}
.logo-word{font-size:25px}

/* ===== v5: 6 bet slots, clear icon, board colour ===== */
.spots{grid-template-columns:repeat(6,1fr)}
.spot{grid-column:span 2}
.spots.five .spot:nth-child(4){grid-column:2/span 2}
.spots.five .spot:nth-child(5){grid-column:4/span 2}
.st-r{display:flex;align-items:center;gap:8px}
.clr-ic{width:30px;height:30px;border-radius:50%;border:2px solid #fca5a5;background:linear-gradient(180deg,#ef4444,#b91c1c);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #7f1212;cursor:pointer;padding:0}
.clr-ic:active{transform:translateY(2px);box-shadow:0 1px 0 #7f1212}
.clr-ic:disabled{opacity:.4}
.pill-x50{color:#10b981;background:#0f2a1a;border-color:rgba(74,222,128,.35)}
.stage::before{background:radial-gradient(circle at 50% 30%,#2f6bff 0%,#1639a8 55%,#0a1a5c 100%);border:5px solid #f59e0b;box-shadow:0 0 0 2px #5a3a05,0 0 0 7px #1a2a7a,inset 0 0 22px rgba(0,0,0,.6),0 16px 26px rgba(0,0,0,.7)}

/* ===== v6: bigger wheel, lighter frame ===== */
.arena-box{padding:46px 0 80px}
.stage{width:min(93vw,426px);filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}
.stage::before{inset:-8px;border:3px solid #f59e0b;box-shadow:0 0 0 2px #5a3a05,inset 0 0 14px rgba(0,0,0,.6),0 12px 20px rgba(0,0,0,.6)}
.hub{width:31%}
.ptr{width:40px;top:-14px}
.room .curt{width:8%}

/* ===== v7: logo + bet button on result row ===== */
.logo-svg{display:block;filter:drop-shadow(0 0 8px rgba(255,170,0,.45))}
.hrow{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#141b2d,#0e131f);border-bottom:1px solid rgba(245,158,11,.25);padding-right:8px}
.hrow .history-bar{flex:1;min-width:0;background:none;border-bottom:0}
.hrow .my-bets{position:static;flex-shrink:0;padding:4px 12px;font-size:11px}

/* ===== v8/v9: player counter bottom-right, plain no-box ===== */
.bar{display:none}
.player-counter{position:absolute;top:auto;left:auto;right:14px;bottom:46px;display:flex;align-items:center;gap:5px;background:none!important;border:0!important;box-shadow:none!important;padding:0!important;font-size:14px;color:#fff;text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.8);z-index:4}
.avatar-stack{display:inline-flex;align-items:center}
.avatar-stack .av{display:inline-flex;width:17px;height:17px;border-radius:50%;margin-left:-7px;position:relative;border:1.2px solid #07090e;box-shadow:0 1px 3px rgba(0,0,0,.8);overflow:hidden}
.avatar-stack .av:first-child{margin-left:0;z-index:1}
.avatar-stack .av:nth-child(2){z-index:2}
.avatar-stack .av:nth-child(3){z-index:3}
.avatar-stack svg{width:100%;height:100%;display:block}
.pcount-num{font-weight:900;font-variant-numeric:tabular-nums;color:#fff;font-size:14px;letter-spacing:.3px;text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.8)}
.promo{position:absolute;left:10px;right:10px;bottom:9px;height:40px;z-index:3;border-radius:10px;overflow:hidden;border:1.5px solid #d97706;background:linear-gradient(90deg,#141b2d,#1c263f 50%,#141b2d);box-shadow:0 3px 10px rgba(0,0,0,.5),inset 0 0 12px rgba(0,0,0,.4);transition:opacity .25s}
.result-badge.show~.promo{opacity:0}
.promo .sl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 10px 4px;font-size:12.5px;font-weight:800;color:#fff;opacity:0;transform:translateX(28px);transition:opacity .5s,transform .5s;white-space:nowrap}
.promo .sl.on{opacity:1;transform:none}
.promo .pw{font-family:'Arial Black',Impact,sans-serif;font-style:italic;font-size:14px;letter-spacing:.5px;background:linear-gradient(180deg,#fffbd0,#ffd23f 55%,#f08a00);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.promo .dots{position:absolute;left:0;right:0;bottom:3px;display:flex;justify-content:center;gap:4px}
.promo .dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.3)}
.promo .dots i.on{background:#f59e0b;width:14px;border-radius:3px}

/* ===== v10: hub text sized to the round box ===== */
.hub b{font-size:min(11.5vw,52px);line-height:1;font-weight:900}
.hub small{font-size:min(3.9vw,17px);margin-top:3px;font-weight:800;line-height:1.1}

/* ===== v11: coloured hub ===== */
.hub{background:radial-gradient(circle at 35% 28%,#6fa0ff 0,#2f64e8 38%,#1535a0 72%,#0a1c66 100%);border:4px solid #f59e0b;box-shadow:0 0 18px rgba(80,140,255,.65),inset 0 -8px 16px rgba(0,0,40,.45),inset 0 6px 10px rgba(255,255,255,.25)}
.hub b{color:#fff;text-shadow:0 2px 4px rgba(0,10,60,.75),0 0 14px rgba(160,200,255,.6)}
.hub small{color:#fbbf24;text-shadow:0 1px 2px rgba(0,0,0,.6)}

/* ===== v12: ALL = bet every box, total-bet status, floating amounts ===== */
.status{font-size:13px;align-items:center}
.status #msg{display:flex;align-items:baseline;gap:6px;font-weight:800}
.status #msg b{font-size:17px;font-weight:900;color:#fbbf24;font-variant-numeric:tabular-nums}
.status #msg b.w{color:#10b981}.status #msg b.l{color:#fca5a5}
.chip:disabled{opacity:.45}
.fl{position:fixed;z-index:80;pointer-events:none;font-weight:900;font-size:20px;color:#fff;white-space:nowrap;text-shadow:0 2px 4px rgba(0,0,0,.85),0 0 10px var(--c,#fff);opacity:0;animation:flt 1.25s cubic-bezier(.2,.7,.3,1) both}
@keyframes flt{0%{opacity:0;transform:translate(-50%,30px) scale(.8)}18%{opacity:1;transform:translate(-50%,8px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-64px) scale(1)}}

/* ===== v13: winners ticker (no box) ===== */
.winners{display:none;overflow:hidden;white-space:nowrap;padding:9px 0 0;font-size:13px;font-weight:800;color:#f8fafc;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.winners.on{display:block}
.wtrack{display:inline-block;padding-left:100%;animation:wmq var(--d,30s) linear infinite}
@keyframes wmq{to{transform:translateX(-100%)}}
.wi{margin-right:30px}
.wn{color:#fbbf24}
.wi b{color:#10b981;font-weight:900}

/* ===== v14: winners rise from above the bet row at result time ===== */
.winners{display:none!important}
.panels-container{position:relative}
.wfeed{position:absolute;left:14px;bottom:100%;height:0;width:72%;pointer-events:none;z-index:15}
.wf{position:absolute;left:0;bottom:6px;white-space:nowrap;font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.85);opacity:0;animation:wup 3.2s ease-out both}
.wf .wn{color:#fbbf24}.wf b{color:#10b981;font-weight:900}
@keyframes wup{0%{opacity:0;transform:translateY(0)}12%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translateY(-170px)}}

/* ===== v15: own win first in the rising feed ===== */
.wf.me{font-size:16px;color:#fff}
.wf.me b{color:#fbbf24;font-size:19px}

/* ===== v16: hub shows only the 10..1 countdown ===== */
.hub small{display:none!important}
.hub b{font-size:min(13vw,60px)}

/* ===== v17: এক স্ক্রিনে পুরো পেজ (স্ক্রল নেই) + রেজাল্টে চাকা zoom ===== */
html{height:100%;overflow:hidden;overscroll-behavior:none}
body{height:100vh;height:100dvh;min-height:0;overflow:hidden;overscroll-behavior:none}
.app-wrapper{height:100vh;height:100dvh;min-height:0;overflow:hidden}
@media(min-width:480px){body{padding:8px}.app-wrapper{height:calc(100vh - 16px);height:calc(100dvh - 16px)}}
header{flex:none;padding:calc(6px + env(safe-area-inset-top)) 12px 6px}
.logo-svg{height:clamp(30px,5.2vh,42px);width:auto}
.hrow{flex:none}
.history-bar{min-height:30px;padding:4px 10px}
.arena-box{flex:1 1 0;min-height:0;padding:14px 0 54px;--ws:min(70vw,34vh);overflow:visible}
.stage{width:var(--ws)}
.ptr{width:clamp(26px,calc(var(--ws)*.1),40px);top:calc(var(--ws)*-.04)}
.hub b{font-size:calc(var(--ws)*.14)}
.promo{height:34px;bottom:8px}
.player-counter{bottom:46px;font-size:13px}
.panels-container{flex:none;margin-top:0;padding:8px 10px 4px;gap:6px}
.bet-card{padding:8px 10px}
.status{margin-bottom:5px;font-size:12px}
.stepper-box{padding:8px 6px 6px;margin-bottom:6px}
.chip{width:clamp(36px,6vh,46px);height:clamp(36px,6vh,46px)}
.spots{gap:6px}
.spot{padding:8px 2px 6px;font-size:clamp(15px,4.6vw,20px)}
.spot small{font-size:9px;margin-top:0}
.provably-fair-tag{flex:none;padding:5px 14px}
#fairLine{flex:none;padding:0 14px 5px!important;font-size:7px!important;line-height:1.25!important}
#fairLine{display:none!important}  /* hash/seed লেখা লুকানো (সার্ভার থেকে ডেটা আসছে, শুধু স্ক্রিনে দেখানো বন্ধ) */
/* zoom */
.rig{transform-origin:50% 50%;transition:transform .9s cubic-bezier(.22,.8,.24,1);will-change:transform}
.result-badge{bottom:auto;top:var(--rby,50%);transform:translate(-50%,-50%) scale(.4);font-size:20px}
.result-badge.show{transform:translate(-50%,-50%) scale(1)}
.promo,.player-counter{transition:opacity .4s}
.arena-box.zm .promo,.arena-box.zm .player-counter{opacity:0}

/* v17b: চাকার উপরের অর্ধেক দেখা যাবে, নিচের অর্ধেক বেট বক্সের নিচে ঢুকবে */
.arena-box{overflow:hidden;overflow:clip;margin-bottom:-8px}
.panels-container{z-index:5}
.rig{transition-duration:1.1s}

/* ===== MW: হোম বাটন (শুধু mw-/mwg- নামে, গেমের স্টাইলে হাত নেই) ===== */
.mw-home{flex:none;display:flex;align-items:center;justify-content:center;gap:6px;width:calc(100% - 28px);height:34px;margin:2px 14px 8px;border-radius:12px;border:1.5px solid #d97706;background:linear-gradient(180deg,#1c263f,#0e131f);color:#fbbf24;font-weight:800;font-size:13px;font-family:inherit;cursor:pointer;box-shadow:0 3px 0 #5a3a05,0 5px 10px rgba(0,0,0,.4)}
.mw-home:active{transform:translateY(2px);box-shadow:0 1px 0 #5a3a05}
.mw-pop{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(3,6,16,.72)}
.mw-pop.mw-on{display:flex}
.mw-card{width:min(86vw,330px);text-align:center;background:linear-gradient(160deg,#141b2d,#07090e);border:2px solid #f59e0b;border-radius:20px;padding:22px 16px 16px;box-shadow:0 0 40px rgba(245,158,11,.3);color:#f8fafc}
.mw-card p{margin:0 0 14px;font-size:17px;font-weight:900;color:#fef3c7}
.mw-yes,.mw-no{display:block;width:100%;height:42px;margin-top:8px;border-radius:12px;font-weight:900;font-size:14px;font-family:inherit;cursor:pointer}
.mw-yes{border:0;color:#fff;background:linear-gradient(180deg,#f59e0b,#ea580c)}
.mw-no{border:1px solid #d97706;background:#1c263f;color:#fbbf24}

/* ===== v18: চাকা ও বেট বক্স একই সাজানো ক্যাসিনো ঘর; জুমে বেট বক্স কাচের মতো স্বচ্ছ ===== */
.arena-box{overflow:visible!important;clip-path:inset(0 0 -100vh 0);background:none!important;border:0!important;box-shadow:none!important}
.room{bottom:calc(-1px*var(--ext,0));border-top:2px solid #d97706;border-bottom:2px solid #d97706;
  background:radial-gradient(circle at 30px 30px,rgba(245,158,11,.12) 2px,transparent 3px) 0 0/60px 60px,radial-gradient(circle at 0 0,rgba(245,158,11,.08) 2px,transparent 3px) 0 0/60px 60px,repeating-linear-gradient(90deg,transparent 0 118px,rgba(245,158,11,.14) 118px 120px),radial-gradient(ellipse at 50% 32%,#7a1636 0%,#4a0d25 52%,#1f0511 100%)}
.panels-container{background:transparent}
.bet-card{background:rgba(20,4,12,.30)!important;border:2px solid rgba(217,119,6,.85)!important;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);box-shadow:0 4px 14px rgba(0,0,0,.35)!important;transition:background .6s,backdrop-filter .6s,-webkit-backdrop-filter .6s}
.bet-card .stepper-box{background:rgba(0,0,0,.22)!important;transition:background .6s}
.bet-card .spots{transition:opacity .6s}
body.zmx .bet-card{background:rgba(255,255,255,.04)!important;-webkit-backdrop-filter:blur(1px);backdrop-filter:blur(1px);border-color:rgba(251,191,36,.9)!important}
body.zmx .bet-card .stepper-box{background:rgba(0,0,0,.08)!important;border-color:rgba(245,158,11,.25)}
body.zmx .bet-card .spots{opacity:.8}

/* ===== v19: কাঁটা (পয়েন্টার) ছোট + চাকার পেগের ধাক্কায় হালকা দোলে ===== */
.ptr{width:clamp(17px,calc(var(--ws)*.065),26px)!important;top:calc(var(--ws)*-.028)!important;transform:translateX(-50%) rotate(var(--pa,0deg));transform-origin:50% 30%}

/* ===== v18: রেজাল্ট শুধু চাকার মাঝের গোল হাবে (ঠিক মিডিলে অ্যাডজাস্ট করা) ===== */
.result-badge{display:none!important}
.hub.res b{white-space:pre;text-align:center;line-height:1.05;font-weight:900;color:#fff;transform:none!important;margin:auto;display:flex;align-items:center;justify-content:center;animation:resIn .45s cubic-bezier(.2,1.5,.4,1) both}
@keyframes resIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
</style>

  if(!S.sound)return;

    const d=last?(c===1?.7:.45):.2;                               /* দৈর্ঘ্য */
    const out=AC.createGain(),lp=AC.createBiquadFilter();
    lp.type='lowpass';lp.frequency.value=3200;lp.Q.value=.5;

    out.gain.linearRampToValueAtTime(v,t+.008);                   /* নরম আক্রমণ, ক্লিক নেই */
    out.gain.exponentialRampToValueAtTime(.0001,t+d);
    [[1,1],[2,.28],[3,.08]].forEach(([m,a])=>{                    /* মূল সুর + হালকা হারমোনিক = ঘণ্টার মতো গাঢ় */

  }catch(e){}
}

function spinTo(seg,dur){
  freezeBotCount();
  dur = Math.max(12000, dur || 12000); // বোর্ড আরও সময় নিয়ে ১২+ সেকেন্ড ঘুরবে
  const n=S.layout.length,st=2*Math.PI/n,TAU=2*Math.PI,base=-((seg+.5)*st)+(Math.random()-.5)*st*.24,from=S.rot;
  const d=(((base-from)%TAU)+TAU)%TAU,t0=performance.now();let lastTick=Math.floor(from/st),prevRot=from,prevT=t0,dirv=1;
  /* শুধু এক দিকে ঘোরে, কখনো উল্টো নয়। শুরুতে ০.৬ সেকেন্ডে মসৃণভাবে গতি ওঠে, তারপর ধীরে ধীরে কমে জেতা ঘরের মাঝে থামে।
     সর্বোচ্চ গতি VCAP-এ আটকানো, তাই খুব দ্রুত ঘুরে উল্টো ঘুরছে বলে ভুল দেখায় না (wagon-wheel ইফেক্ট) */
  const VCAP=6.5,tu=Math.min(.8,dur/4000),T=dur/1000,K=tu/2+(T-tu)/3;
  const N=Math.max(0,Math.floor((VCAP*K-d)/TAU)),D=d+TAU*N,Vm=D/K,to=from+D;
  S.spinning=true;
  if(dur>6500){S.goUntil=Date.now()+1000;goChime()}   /* ১০…১ এর পর "GO" */
  function finish(){
    S.spinning=false;PT.tg=0;ptrGo();const r=S.st&&S.st.result;
    if(r){
      S.winSeg=r.seg;
      if(!S.st||Z.skip!==S.st.roundId){zoomIn();S.resShow=S.st.roundId}
      hubSet();
      // রেজাল্ট দেওয়ার পরে ৫০০ থেকে শুরু হয়ে উইনার্স ফিড উঠবে:
      const rId=S.st?S.st.roundId:S.spun;
      setTimeout(()=>triggerAutoFeed(rId),450);
    }
  }
  (function f(now){const t=Math.max(0,now-t0)/1000;let done=false;
    if(t<tu)S.rot=from+Vm*(t/2-tu/(2*Math.PI)*Math.sin(Math.PI*t/tu));
    else if(t<T){const q=(t-tu)/(T-tu);S.rot=from+Vm*tu/2+Vm*(T-tu)/3*(1-Math.pow(1-q,3))}
    else{S.rot=to;done=true}
    if(S.rot<prevRot)S.rot=prevRot;                    /* কোনো অবস্থাতেই পিছনে যাবে না */
    const dts=Math.max(.001,(now-prevT)/1000),dr=S.rot-prevRot,speed=Math.abs(dr)/st/dts; /* সেকেন্ডে কয়টা দাগ পার হচ্ছে */
    if(!done){
      const u=S.rot/st,dd=u-Math.round(u),C=.35,amp=PT_MAX*Math.max(.2,Math.min(1,16/Math.max(speed,1)));
      PT.tg=(dd<0&&dd>-C)?-amp*(1+dd/C):0;              /* দাগ কাঁটাকে ডানে ঠেলে, পার হলে ছেড়ে দেয় */
      ptrGo();
    }
    const k=Math.floor(S.rot/st);if(k!==lastTick){lastTick=k;if(!done)pegTick(speed)}
    prevRot=S.rot;prevT=now;
    if(!done)requestAnimationFrame(f);else finish()})(t0);
}

  const pn=document.querySelector('.panels-container');if(pn)a.style.setProperty('--ext',Math.max(0,pn.offsetTop+pn.offsetHeight-a.offsetTop-a.offsetHeight));

function zoomIn(){

  if(!a||!rig||!st||!pn||Z.on)return;

  const cardTop=pn.offsetTop+8;                       /* বেট বক্সের উপরের কিনারা (wrapper-এর হিসাবে) */
  const arenaTop=a.offsetTop+2;
  const curY=a.offsetTop+rig.offsetTop+st.offsetTop+w/2;
  const avail=cardTop-arenaTop-6;
  const R=avail/(1.08+16/w),sc=Math.max(1,Math.min(ZOOM_MAX*((parseFloat(a.dataset.ws0)||w)/w),2*R/w));
  /* zoom আগের মতোই; চাকা উপরে উঠে উপরের ফাঁক ভরবে (মাথা উপরের কিনারা পর্যন্ত) */
  const ext=(sc*w/2)*(1.08+16/w);
  const tgtY=Math.min(cardTop,arenaTop+6+ext);
  rig.style.transform='translate(0,'+(tgtY-curY).toFixed(1)+'px) scale('+sc.toFixed(3)+')';
  a.style.setProperty('--rby',(cardTop-a.offsetTop-34).toFixed(1)+'px');

else if(token)connect();
else if(fbAuth){let done=false;const un=fbAuth.onAuthStateChanged(u=>{if(done)return;if(u&&!u.isAnonymous){done=true;un();connect()}});setTimeout(()=>{if(!done){done=true;showFatal(NOLOGIN)}},6000)}
else showFatal(NOLOGIN);
</script>
<script>
(function(){
  var pop=document.getElementById('mwHomePop'),btn=document.getElementById('mwHomeBtn'),yes=document.getElementById('mwYes'),no=document.getElementById('mwNo');
  if(!pop||!btn||!yes||!no)return;
  function open(){pop.classList.add('mw-on')}
  function close(){pop.classList.remove('mw-on')}
  btn.addEventListener('click',open);
  no.addEventListener('click',close);
  pop.addEventListener('click',function(e){if(e.target===pop)close()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
  yes.addEventListener('click',function(){
    close();
    setTimeout(function(){
      var u='https://trunamentgame-dev.github.io/NP-TRUNAMENT/';
      try{window.top.location.replace(u)}catch(err){location.replace(u)}
    },900);
  });
})();
</script>
</body>
</html>
