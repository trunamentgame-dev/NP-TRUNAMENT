async function resync(){const j=await api('/api/game/state?hv='+histV+(uid?'&uid='+encodeURIComponent(uid):''));if(j&&j.success)applyState(j,true);await fetchBalance()}

// ===================== সার্ভার স্টেট → UI =====================
function setExtraUI(){SUMS.forEach(s=>{const x=$('x'+s);x.textContent=extra[s]?PAY[s]*extra[s]+'X':'';x.parentNode.classList.toggle('ex',!!extra[s])});
 if(Object.keys(extra).length){const e=$('extra');e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}}
function runTick(){clearInterval(tick);tick=setInterval(()=>{if(phase!=='bet'){clearInterval(tick);return}
 const l=Math.max(0,endsAt-now());$('bar').style.transform=`scaleX(${Math.min(1,l/betMs)})`;$('status').textContent='বেট ধরুন';
 const sec=Math.ceil(l/1000);$('cdn').textContent=sec;$('cdr').style.strokeDashoffset=119.4*(1-Math.min(1,l/betMs));$('cd').className='cd show'+(sec<=3?' hot':sec<=5?' warn':'');
 // প্রতিবেটে 50/200 জন বেট ধরছে এমন ডায়নামিক অগ্রগতি (লাইভ ইউজারদের মতো আচরণ)
 const progress=Math.min(1,Math.max(0,1-(l/betMs)));
 const targetSoFar=Math.max(simCurD+simCurS+simCurU,Math.floor(simTargetPlayers*Math.pow(progress,0.82)));
 simCurD=Math.max(1,Math.round(targetSoFar*simSplit.d));
 simCurS=Math.max(1,Math.round(targetSoFar*simSplit.s));
 simCurU=Math.max(1,targetSoFar-simCurD-simCurS);
 simCurPool=Math.max(simCurPool,targetSoFar*simPoolPerPlayer+Math.floor((Math.random()-.5)*60));
 live.d=simCurD; live.s=simCurS; live.u=simCurU; live.pool=simCurPool;
 drawSide(); drawPct();
 if(l<=0){$('cd').className='cd';$('status').textContent='বেট বন্ধ…';lock(true)}},100)}
function startBetting(s){phase='bet';round=s.round;bets={};stack=[];extra=s.extra||{};
 resetSimRound();
 live.d=simCurD; live.s=simCurS; live.u=simCurU; live.pool=simCurPool;
 $('res').className='res';$('rnd').textContent=round;Q('.win').forEach(e=>e.classList.remove('win'));$('grp').classList.remove('lift');lock(false);setExtraUI();
 if(s.me&&s.me.bets&&Object.keys(s.me.bets).length){bets={...s.me.bets};stack=Object.entries(bets)}
 render();runTick();drawSide();drawPct();
 if(auto&&last&&!sum(bets))setTimeout(()=>{if(phase==='bet')placeMany(last,true)},200)}
function doRoll(s){phase='roll';round=s.round;clearInterval(tick);lock(true);$('cd').className='cd';$('tray').classList.remove('show');if(sum(bets))last={...bets};
 const[a,b]=s.dice,g=$('grp'),lateMs=s.endsAt-now();$('status').textContent='ডাইস গড়াচ্ছে…';
 if(lateMs<1800){document.documentElement.style.removeProperty('--rd');setDie(0,a,0);setDie(1,b,0);g.classList.add('lift');return}
  const dur=Math.max(1800,Math.min(3400,lateMs-450));document.documentElement.style.setProperty('--rd',dur+'ms');
 rattle(Math.round(dur*.8/170));g.classList.add('shake');dice.forEach(d=>{d.w.classList.remove('toss');void d.w.offsetWidth;d.w.classList.add('toss')});setDie(0,a,1);setDie(1,b,1);
 setTimeout(()=>g.classList.remove('shake'),dur*.7);setTimeout(()=>g.classList.add('lift'),dur+120)}
function doResult(s,wasRoll){phase='result';round=s.round;clearInterval(tick);lock(true);$('cd').className='cd';
 const[a,b]=s.dice,sm=a+b,kd=kind(sm),g=$('grp');
 if(!wasRoll){document.documentElement.style.removeProperty('--rd');setDie(0,a,0);setDie(1,b,0)}g.classList.remove('shake');g.classList.add('lift');
 const R=$('res');R.innerHTML=`<b>${sm}</b><span>${kd==='down'?'7 DOWN':kd==='up'?'7 UP':'LUCKY 7'}</span>`;R.className='res show '+kd;
 $('status').textContent=`${sm} · ${kd==='down'?'7 DOWN':kd==='up'?'7 UP':'LUCKY 7'}`;
 Q(`[data-k="${kd}"],[data-k="n${sm}"]`).forEach(e=>e.classList.add('win'));
 // রাউন্ড শেষে নতুন র‍্যান্ডম 2k, 5k, 10k লাস্ট উইন অ্যাড হবে
 live.win.unshift(genWinItem());
 if(Math.random()>0.45) live.win.unshift(genWinItem());
 if(live.win.length>5) live.win.length=5;
 drawSide();
 const m=s.me&&s.me.last;
 if(m&&m.round===s.round){const net=Math.round((m.ret-m.stake)*100)/100;
  if(net>0){toast('+৳'+fmtB(net)+' জিতেছেন');winSnd();burst()}else if(m.stake){toast('এবার হেরেছেন');beep(180,.35,'sawtooth',.05)}}
 bets={};stack=[];render();setTimeout(fetchBalance,900)}
function applyState(s,force){
 if(!s||!s.success)return;
 srvOff=s.now-Date.now();
 if(s.phase==='init'){$('status').textContent='সার্ভার প্রস্তুত হচ্ছে…';return}
 MIN=s.min||MIN;MAX=s.max||MAX;betMs=s.betMs||betMs;
 const iu=document.querySelector('.info u'),is=document.querySelector('.info s');if(iu)iu.textContent=MIN;if(is)is.textContent=MAX;
 if(s.hist){H=s.hist;histV=s.hv;drawHist()}
 // অনলাইন প্লেয়ার ৫০-২৫০+ র্যান্ডম ও অ্যাক্টিভ সিমুলেশন + সার্ভার ডেটা সমন্বয়
 live.on=Math.max(simOnline,s.online||0);
 if(s.stats&&s.stats.pool>0){
  live.d=Math.max(s.stats.d,simCurD);
  live.s=Math.max(s.stats.s,simCurS);
  live.u=Math.max(s.stats.u,simCurU);
  live.pool=Math.max(s.stats.pool,simCurPool);
 }else{
  live.d=simCurD;
  live.s=simCurS;
  live.u=simCurU;
  live.pool=simCurPool;
 }
 if(s.winners&&s.winners.length>0){live.win=s.winners}
 endsAt=s.endsAt;gotState=true;ready();
 if(s.authErr==='BAD_TOKEN')refreshToken();
 const changed=s.round!==round||s.phase!==phase;
 if(changed){const wasRoll=phase==='roll'&&round===s.round;
  if(s.phase==='bet')startBetting(s);else if(s.phase==='roll'&&s.dice)doRoll(s);else if(s.phase==='result'&&s.dice)doResult(s,wasRoll)}
 else if(force&&s.phase==='bet'&&s.me){bets={...s.me.bets};stack=Object.entries(bets);render()}
 drawSide();drawPct()}
async function poll(){clearTimeout(pollT);
 const j=await api('/api/game/state?hv='+histV+(uid?'&uid='+encodeURIComponent(uid):''));
 let wait=2000;
 if(j&&j.success){applyState(j);if(j.endsAt)wait=Math.min(1000,Math.max(150,j.endsAt-(Date.now()+srvOff)+120))}
 else if(!gotState)setLd(null,'সার্ভারের সাথে সংযোগ হচ্ছে…');
 else $('status').textContent='সংযোগ হচ্ছে…';
 pollT=setTimeout(poll,wait)}

// ===================== সাইড প্যানেল (রিয়েল ডেটা) =====================
function drawPct(){const T=live.d+live.s+live.u;if(!T){$('pd').textContent='0%';$('pl7').textContent='0%';$('pu').textContent='0%';$('bd').style.width='33.3%';$('bs').style.width='33.3%';$('bu').style.width='33.4%';return}
 const pD=Math.round(live.d/T*100),pS=Math.round(live.s/T*100),pU=100-pD-pS;
 $('pd').textContent=pD+'%';$('pl7').textContent=pS+'%';$('pu').textContent=pU+'%';
 $('bd').style.width=(live.d/T*100)+'%';$('bs').style.width=(live.s/T*100)+'%';$('bu').style.width=(live.u/T*100)+'%'}
function drawSide(){const t=live.d+live.s+live.u,pc=k=>t?Math.round(live[k]/t*100):0;
 $('sl').innerHTML=`<h4>ONLINE</h4><div class="big"><span class="dot"></span>${live.on}</div><h4 style="margin-top:6px">PLAYERS · ${t}</h4>`+[['d','DOWN','g'],['s','7','b'],['u','UP','r']].map(([k,n,cl])=>`<div class="row"><span>${n}</span><span class="bar"><i class="${cl}" style="width:${pc(k)}%"></i></span><span>${live[k]}</span></div>`).join('');
 $('sr').innerHTML=`<h4>TOTAL BET</h4><div class="big">৳${fmtB(live.pool)}</div><h4 style="margin-top:6px">LAST WIN</h4>`+(live.win.length?live.win.map(w=>`<div class="row"><span>${w.n}</span><span style="margin-left:auto;color:#ffd24a">+${fmtB(w.w)}</span></div>`).join(''):'<div class="row">—</div>');
 [0,1,2].forEach(i=>{const e=$('pb'+i),w=live.win[i];if(!e)return;e.textContent=w?'+'+fmtB(w.w):'';e.style.color=w?'#ffd24a':''})}
lock(true);drawHist();render();poll();

</script><script>
/* স্ক্রিন সাইজ অনুযায়ী পুরো গেম নিজে থেকে ফিট হবে (নিচে ফাঁকা থাকবে না) */
(function(){const a=document.querySelector('.app');let raf=0;
function fit(){try{const cs=getComputedStyle(document.body),vh=window.innerHeight-(parseFloat(cs.paddingTop)||0)-(parseFloat(cs.paddingBottom)||0);
a.style.zoom='1';a.style.height='auto';const nat=a.getBoundingClientRect().height;
let z=nat>0?Math.min(1,vh/nat):1;z=Math.max(.5,z);a.style.zoom=String(z);a.style.height=(vh/z)+'px'}catch(e){}}
function sched(){cancelAnimationFrame(raf);raf=requestAnimationFrame(fit)}
addEventListener('resize',sched);addEventListener('orientationchange',sched);addEventListener('load',sched);
if(window.visualViewport)visualViewport.addEventListener('resize',sched);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(sched);fit()})();
</script>
</body></html>
