  p.style.cssText=`position:absolute;left:${50+(Math.random()-.5)*20}%;top:42%;width:${6+Math.random()*6}px;height:${10+Math.random()*8}px;background:hsl(${20+Math.random()*60},95%,${50+Math.random()*15}%);border-radius:2px;transition:transform 1.7s cubic-bezier(.2,.7,.3,1),opacity 1.7s`;
  f.appendChild(p);requestAnimationFrame(()=>requestAnimationFrame(()=>{p.style.transform=`translate(${dx}px,${dy}px) rotate(${r}deg)`;p.style.opacity=0}))}
 setTimeout(()=>f.remove(),1900)}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1700)}
// render
function render(){const to=Wallet.get(),from=shown,t0=performance.now();cancelAnimationFrame(tw);
 const st=t=>{const p=Math.min(1,(t-t0)/500);shown=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));$('bal').textContent=$('bal2').textContent=shown.toLocaleString();if(p<1)tw=requestAnimationFrame(st)};tw=requestAnimationFrame(st);
 Q('[data-k]').forEach(e=>{const v=bets[e.dataset.k]||'';e.querySelector('.amt').textContent=v;e.dataset.a=v});$('tot').textContent=sum(bets).toLocaleString();$('rno').textContent=round;drawSide();drawPct()}
function drawHist(){const mf=n=>`<div class="mf">${[0,1,2,3,4,5,6,7,8].map(k=>`<i style="opacity:${pips[n].includes(k)?1:0}"></i>`).join('')}</div>`;
 const h=H.slice(-12);$('hist').innerHTML=h.map(([a,b,x],i)=>`<div class="he${i==h.length-1?' cur':''}"><em>${x?'★':''}</em>${mf(a)}${mf(b)}<span class="${kind(a+b)}">${a+b}</span></div>`).join('');
 const c={down:0,lucky:0,up:0};H.forEach(([a,b])=>c[kind(a+b)]++);const p=k=>Math.round(c[k]/H.length*100)+'%';$('pd').textContent=p('down');$('pu').textContent=p('up');$('pl7').textContent=p('lucky')}
// betting
function place(k,amt,quiet){if(phase!=='bet')return;const b=Wallet.get();
 if(amt>b){if(!quiet)toast('ব্যালেন্স কম');return}
 if((bets[k]||0)+amt>MAX){if(!quiet)toast('সর্বোচ্চ ৳'+MAX);return}
 Wallet.set(b-amt);bets[k]=(bets[k]||0)+amt;stack.push([k,amt]);if(!quiet)beep(900,.06,'square',.04);render()}
Q('[data-k]').forEach(b=>b.onclick=()=>place(b.dataset.k,chip));
$('undo').onclick=()=>{if(phase!=='bet'||!stack.length)return;const[k,a]=stack.pop();bets[k]-=a;if(!bets[k])delete bets[k];Wallet.set(Wallet.get()+a);render()};
$('clear').onclick=()=>{if(phase!=='bet')return;Wallet.set(Wallet.get()+sum(bets));bets={};stack=[];render()};
$('dbl').onclick=()=>{if(phase!=='bet')return;const s={...bets};if(sum(s)>Wallet.get())return toast('ব্যালেন্স কম');for(const k in s)place(k,s[k],true);beep(900,.06,'square',.04)};
$('auto').onclick=()=>{auto=!auto;$('auto').classList.toggle('on',auto);toast(auto?'Auto চালু':'Auto বন্ধ')};
$('chipbtn').onclick=()=>$('tray').classList.toggle('show');
$('tray').onclick=e=>{const b=e.target.closest('button');if(!b)return;chip=+b.dataset.v;$('chipbtn').textContent=chip;$('chipbtn').dataset.v=chip;$('tray').classList.remove('show')};
$('mm').onclick=()=>{const on=$('sums').style.display!=='none';$('sums').style.display=on?'none':'grid';$('mm').classList.toggle('on',!on)};
$('road').onclick=()=>{$('rg').innerHTML=H.map(([a,b])=>{const s=a+b;return`<span class="${kind(s)}">${s}</span>`}).join('');$('rm').classList.add('show');$('rg').scrollLeft=1e4};
$('rx').onclick=()=>$('rm').classList.remove('show');
$('free').onclick=()=>{if(!freeC)return toast('ফ্রি শেষ');freeC--;$('fc').textContent=freeC;const r=[10,20,50,100][Math.random()*4|0];Wallet.set(Wallet.get()+r);render();winSnd();toast('+৳'+r+' ফ্রি')};
const lock=on=>Q('.z,.sm,.cb,.bigchip').forEach(b=>b.disabled=on);
// bots
function botBets(){BOTS.forEach((b,i)=>{const r=Math.random();b.k=r<.4?'down':r<.8?'up':r<.88?'lucky':'n'+SUMS[Math.random()*10|0];b.amt=[100,200,500,1000,2000][Math.random()*5|0];const e=$('pb'+i);e.textContent=b.amt.toLocaleString();e.style.color='';e.previousElementSibling.classList.remove('happy','sad')})}
function botSettle(s){BOTS.forEach((b,i)=>{const n=+b.k.slice(1),o=b.k===kind(s)?ODD[b.k]:b.k==='n'+s?PAY[n]*(extra[n]||1):0,e=$('pb'+i);e.textContent=o?'+'+(b.amt*o).toLocaleString():'-'+b.amt.toLocaleString();e.style.color=o?'#ffd24a':'#f99';const a=e.previousElementSibling;a.classList.remove('happy','sad');void a.offsetWidth;a.classList.add(o?'happy':'sad')})}
// round loop
function startBetting(){phase='bet';$('res').className='res';$('rnd').textContent=round;Q('.win').forEach(e=>e.classList.remove('win'));$('grp').classList.remove('lift');lock(false);
 if(Wallet.get()<=0){Wallet.set(5000);toast('নতুন ৳5000')}
 extra={};if(Math.random()<EXTRA.chance){const n=1+(Math.random()*2|0);while(Object.keys(extra).length<n)extra[SUMS[Math.random()*10|0]]=EXTRA.mult}
 SUMS.forEach(s=>{const x=$('x'+s);x.textContent=extra[s]?PAY[s]*extra[s]+'X':'';x.parentNode.classList.toggle('ex',!!extra[s])});
 if(Object.keys(extra).length){const e=$('extra');e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
 botBets();if(auto&&last)for(const k in last)place(k,last[k],true);render();
 const end=Date.now()+BETTING*1000;clearInterval(tick);
 tick=setInterval(()=>{const l=Math.max(0,end-Date.now());$('bar').style.transform=`scaleX(${l/(BETTING*1000)})`;$('status').textContent='বেট ধরুন · '.split(' ·')[0];const sec=Math.ceil(l/1000);$('cdn').textContent=sec;$('cdr').style.strokeDashoffset=119.4*(1-l/(BETTING*1000));$('cd').className='cd show'+(sec<=3?' hot':sec<=5?' warn':'');if(l<=0){clearInterval(tick);roll()}},100)}
function roll(){phase='roll';lock(true);$('cd').className='cd';$('tray').classList.remove('show');if(sum(bets))last={...bets};
 const a=rnd6(),b=rnd6(),g=$('grp');$('status').textContent='ডাইস গড়াচ্ছে…';rattle();setTimeout(()=>beep(110,.18,'sine',.2),ROLL_MS-500);
 g.classList.add('shake');dice.forEach(d=>{d.w.classList.remove('toss');void d.w.offsetWidth;d.w.classList.add('toss')});setDie(0,a,1);setDie(1,b,1);
 setTimeout(()=>{g.classList.remove('shake');g.classList.add('lift');setTimeout(()=>settle(a,b),600)},ROLL_MS)}
function settle(a,b){const s=a+b,kd=kind(s);phase='result';let ret=0;const R=$('res');R.innerHTML=`<b>${s}</b><span>${kd==='down'?'7 DOWN':kd==='up'?'7 UP':'LUCKY 7'}</span>`;R.className='res show '+kd;
 for(const k in bets){const o=k===kd?ODD[k]:k==='n'+s?PAY[s]*(extra[s]||1):0;if(o)ret+=bets[k]*(o+1)}
 const stake=sum(bets);if(ret)Wallet.set(Wallet.get()+ret);
 $('status').textContent=`${s} · ${kd==='down'?'7 DOWN':kd==='up'?'7 UP':'LUCKY 7'}`;
 Q(`[data-k="${kd}"],[data-k="n${s}"]`).forEach(e=>e.classList.add('win'));botSettle(s);
 H.push([a,b,extra[s]?1:0]);if(H.length>100)H.shift();saveH();drawHist();
 if(ret){toast('+৳'+(ret-stake).toLocaleString()+' জিতেছেন');winSnd();burst()}else if(stake){toast('এবার হেরেছেন');beep(180,.35,'sawtooth',.05)}
 bets={};stack=[];round++;if(round%5===0){freeC++;$('fc').textContent=freeC}render();setTimeout(startBetting,RESULT_MS)}
const demo={on:0,d:0,s:0,u:0,pool:0,win:[],ph:''},fmt=n=>n.toLocaleString(),nm=()=>String.fromCharCode(97+Math.random()*26|0)+'***'+(Math.random()*10|0);
function drawSide(){if(!demo.win.length)demo.win=Array.from({length:3},()=>[nm(),[1000,2000,5000,10000][Math.random()*4|0]]);const t=demo.d+demo.s+demo.u+(sum(bets)?1:0)||1,pc=k=>Math.round(demo[k]/t*100);
 $('sl').innerHTML=`<h4>ONLINE</h4><div class="big"><span class="dot"></span>${demo.on}</div><h4 style="margin-top:6px">BETTING · ${t}</h4>`+[['d','DOWN','#14a34a'],['s','7','#2a8ae6'],['u','UP','#e23a40']].map(([k,n,c])=>`<div class="row"><span>${n}</span><span class="bar"><i style="width:${pc(k)}%;background:${c}"></i></span><span>${demo[k]}</span></div>`).join('');
 $('sr').innerHTML=`<h4>TOTAL BET</h4><div class="big">৳${fmt(demo.pool+sum(bets))}</div><h4 style="margin-top:6px">LAST WIN</h4>`+(demo.win.length?demo.win.map(w=>`<div class="row"><span>${w[0]}</span><span style="margin-left:auto;color:#ffd24a">+${fmt(w[1])}</span></div>`).join(''):'<div class="row">—</div>')}
function drawPct(){const c={d:demo.d+(bets.down?1:0),s:demo.s+(bets.lucky?1:0),u:demo.u+(bets.up?1:0)},T=c.d+c.s+c.u,p=k=>T?Math.round(c[k]/T*100):0,w=k=>T?c[k]/T*100:33.3;
 $('pd').textContent=p('d')+'%';$('pl7').textContent=p('s')+'%';$('pu').textContent=p('u')+'%';
 $('bd').style.width=w('d')+'%';$('bs').style.width=w('s')+'%';$('bu').style.width=w('u')+'%'}
setInterval(()=>{if(phase!==demo.ph){demo.ph=phase;
 if(phase==='bet'){demo.on=150+Math.random()*200|0;demo.d=demo.s=demo.u=0;demo.pool=0}
 if(phase==='result'){const[a,b]=H[H.length-1],o=kind(a+b)==='lucky'?5:2;demo.win=Array.from({length:3},()=>[nm(),[500,1000,2000,5000][Math.random()*4|0]*o])}}
 if(phase==='bet'){demo.on+=Math.random()*3|0;const r=Math.random(),k=r<.42?'d':r<.8?'u':'s',n=1+Math.random()*4|0;demo[k]+=n;demo.pool+=n*[50,100,200,500][Math.random()*4|0]}
 drawSide();drawPct()},500);
function cnt(){const c={d:demo.d,s:demo.s,u:demo.u},m=new Set();for(const k in bets)if(bets[k])m.add(k==='down'?'d':k==='up'?'u':k==='lucky'?'s':(+k.slice(1)<7?'d':'u'));m.forEach(x=>c[x]++);return c}
function drawPct(){const c=cnt(),T=c.d+c.s+c.u,p=k=>T?Math.round(c[k]/T*100):0,w=k=>T?c[k]/T*100:33.3;$('pd').textContent=p('d')+'%';$('pl7').textContent=p('s')+'%';$('pu').textContent=p('u')+'%';$('bd').style.width=w('d')+'%';$('bs').style.width=w('s')+'%';$('bu').style.width=w('u')+'%'}
function drawSide(){if(!demo.win.length)demo.win=Array.from({length:3},()=>[nm(),[1000,2000,5000,10000][Math.random()*4|0]]);const c=cnt(),t=c.d+c.s+c.u,pc=k=>t?Math.round(c[k]/t*100):0;
 $('sl').innerHTML=`<h4>ONLINE</h4><div class="big"><span class="dot"></span>${demo.on}</div><h4 style="margin-top:6px">BETTING · ${t}</h4>`+[['d','DOWN','g'],['s','7','b'],['u','UP','r']].map(([k,n,cl])=>`<div class="row"><span>${n}</span><span class="bar"><i class="${cl}" style="width:${pc(k)}%"></i></span><span>${c[k]}</span></div>`).join('');
 $('sr').innerHTML=`<h4>TOTAL BET</h4><div class="big">৳${fmt(demo.pool+sum(bets))}</div><h4 style="margin-top:6px">LAST WIN</h4>`+demo.win.map(w=>`<div class="row"><span>${w[0]}</span><span style="margin-left:auto;color:#ffd24a">+${fmt(w[1])}</span></div>`).join('')}
const HOME_URL=''; // নিজের user panel-এর লিংক এখানে দিন, যেমন 'https://.../index.html'
$('home').onclick=()=>{try{if(window.AndroidBridge&&AndroidBridge.goHome){AndroidBridge.goHome();return}}catch(e){}if(HOME_URL)location.href=HOME_URL;else if(history.length>1)history.back();else location.href='/'};
drawHist();startBetting();
</script></body></html>
